services:
  - type: web
    name: valorant-matchmaker
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: REDIS_URL
        fromService:
          type: redis
          name: matchmaker-redis
          property: connectionString
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./matchmaking.db
      - key: LOBBY_SIZE
        value: "10"
      - key: RIOT_API_KEY
        sync: false

  - type: redis
    name: matchmaker-redis
    ipAllowList: [] # internal connections only
    plan: free
